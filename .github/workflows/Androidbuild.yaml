name: Build ANGLE for ZalithLauncher (Android ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools
      GCLIENT_SUPPRESS_GIT_VERSION_WARNING: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Install base system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git python3 python3-distutils python3-setuptools \
            default-jdk \
            ninja-build \
            xz-utils \
            ccache \
            lsb-release
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPOT_TOOLS_PATH }}
          key: depot_tools-${{ runner.os }}-v1

      - name: Get depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ${{ env.DEPOT_TOOLS_PATH }}

      - name: Add depot_tools to PATH
        run: echo "${{ env.DEPOT_TOOLS_PATH }}" >> $GITHUB_PATH

      - name: Configure gclient for Android
        run: |
          cat <<EOF > .gclient
          solutions = [
            {
              "name"        : "angle",
              "url"         : "https://chromium.googlesource.com/angle/angle.git",
              "deps_file"   : "DEPS",
              "managed"     : False,
              "custom_deps" : {},
            },
          ]
          target_os = ['android']
          EOF

      - name: Sync ANGLE source and dependencies
        run: |
          gclient sync --no-history --shallow --jobs $(nproc)

      - name: Install build dependencies (official script)
        run: |
          cd angle
          ./build/install-build-deps.sh

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-arm64-${{ hashFiles('.github/workflows/build-angle-android-arm64.yml') }}
          restore-keys: |
            ccache-android-arm64-

      - name: Configure GN for Android ARM64 (ZalithLauncher optimised)
        run: |
          cd angle
          gn gen out/Android --args='
            target_os = "android"
            target_cpu = "arm64"
            # 关闭 CFI 以避免与 Minecraft 1.21+ 的安全机制冲突
            arm_control_flow_integrity = "none"
            is_debug = false
            is_component_build = false
            # Vulkan 后端是 MobileGlues/ZalithLauncher 的必需通道
            angle_enable_vulkan = true
            angle_enable_gl = true
            angle_enable_egl = true
            # 文件名后缀必须匹配启动器要求
            angle_egl_suffix = "_angle"
            angle_glesv2_suffix = "_angle"
            cc_wrapper = "ccache"
          '

      - name: Build only required ANGLE libraries
        run: |
          cd angle
          autoninja -C out/Android libGLESv2_angle.so libEGL_angle.so

      - name: Upload ANGLE libraries
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-arm64-libs
          path: |
            angle/out/Android/libGLESv2_angle.so
            angle/out/Android/libEGL_angle.so