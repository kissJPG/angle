name: Build ANGLE for Android ARM64 (Optimized Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 使用 ubuntu:22.04 容器以确保 python3-distutils 等依赖可用
    container:
      image: ubuntu:22.04
      options: --user root
    timeout-minutes: 180

    env:
      DEPOT_TOOLS_PATH: /__w/depot_tools
      # 抑制 gclient 的 git 版本警告
      GCLIENT_SUPPRESS_GIT_VERSION_WARNING: 1
      # ccache 缓存目录
      CCACHE_DIR: /root/.ccache

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl git python3 python3-distutils python3-setuptools \
            default-jdk \
            ninja-build \
            xz-utils \
            ccache \
            lsb-release
          ln -s /usr/bin/python3 /usr/bin/python

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPOT_TOOLS_PATH }}
          key: depot_tools-${{ runner.os }}-docker-v1

      - name: Get depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ${{ env.DEPOT_TOOLS_PATH }}

      - name: Add depot_tools to PATH
        run: echo "${{ env.DEPOT_TOOLS_PATH }}" >> $GITHUB_PATH

      - name: Configure gclient for Android
        run: |
          cat <<EOF > .gclient
          solutions = [
            {
              "name"        : "angle",
              "url"         : "https://chromium.googlesource.com/angle/angle.git",
              "deps_file"   : "DEPS",
              "managed"     : False,
              "custom_deps" : {},
            },
          ]
          target_os = ['android']
          EOF

      - name: Sync ANGLE source and dependencies
        run: |
          gclient sync --no-history --shallow --jobs $(nproc)

      # 运行官方推荐的依赖安装脚本
      - name: Install build dependencies (official script)
        run: |
          cd angle
          ./build/install-build-deps.sh

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-arm64-${{ hashFiles('.github/workflows/build-angle-android-arm64.yml') }}
          restore-keys: |
            ccache-android-arm64-

      - name: Configure GN for Android ARM64
        run: |
          cd angle
          gn gen out/Android --args='
            target_os = "android"
            target_cpu = "arm64"
            arm_control_flow_integrity = "none"
            is_debug = false
            is_component_build = false
            angle_enable_vulkan = true
            angle_enable_gl = true
            angle_enable_egl = true
            cc_wrapper = "ccache"
          '

      - name: Build ANGLE
        run: |
          cd angle
          autoninja -C out/Android

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-arm64
          path: |
            angle/out/Android/lib*.so
            angle/out/Android/*.a