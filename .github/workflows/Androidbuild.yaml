name: Build ANGLE for Android ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest          # 使用 x86-64 构建主机（交叉编译）
    timeout-minutes: 180

    env:
      DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools
      ANGLE_SRC: ${{ github.workspace }}/angle

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git python3 python3-distutils \
            default-jdk \
            ninja-build
          # depot_tools 需要直接调用 python
          sudo ln -s /usr/bin/python3 /usr/bin/python 2>/dev/null || true

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPOT_TOOLS_PATH }}
          key: depot_tools-${{ runner.os }}-v2

      - name: Get depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ${{ env.DEPOT_TOOLS_PATH }}
        id: cache-depot-tools

      - name: Add depot_tools to PATH
        run: echo "${{ env.DEPOT_TOOLS_PATH }}" >> $GITHUB_PATH

      - name: Configure gclient for Android
        run: |
          cat <<EOF > .gclient
          solutions = [
            {
              "name"        : "angle",
              "url"         : "https://chromium.googlesource.com/angle/angle.git",
              "deps_file"   : "DEPS",
              "managed"     : False,
              "custom_deps" : {},
            },
          ]
          target_os = ["android"]
          EOF

      - name: Sync ANGLE source and Android dependencies
        run: |
          gclient sync --no-history --shallow --with_branch_heads

      - name: Configure GN for Android ARM64
        run: |
          cd angle
          gn gen out/Android-arm64 --args='
            target_os = "android"
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            angle_enable_vulkan = true
            angle_enable_gl = true
            angle_enable_egl = true
            angle_build_all = true
          '

      - name: Build ANGLE
        run: |
          cd angle
          autoninja -C out/Android-arm64

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-arm64
          path: |
            angle/out/Android-arm64/lib*.so
            angle/out/Android-arm64/*.a