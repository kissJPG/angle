name: Build ANGLE (ARM64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-angle-arm64:
    name: Build ANGLE for Linux ARM64
    runs-on: ubuntu-22.04-arm  # 原生 ARM64 运行器
    timeout-minutes: 120

    env:
      # depot_tools 路径
      DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools
      # ANGLE 源码路径
      ANGLE_SRC: ${{ github.workspace }}/angle

    steps:
      - name: Checkout code (if needed)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            python3 \
            python3-distutils \
            libx11-xcb-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            ninja-build

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPOT_TOOLS_PATH }}
          key: depot_tools-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Get depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ${{ env.DEPOT_TOOLS_PATH }}

      - name: Add depot_tools to PATH
        run: echo "${{ env.DEPOT_TOOLS_PATH }}" >> $GITHUB_PATH

      - name: Configure gclient (no hooks for speed on first sync)
        run: |
          cat <<EOF > .gclient
          solutions = [
            {
              "name"        : "angle",
              "url"         : "https://chromium.googlesource.com/angle/angle.git",
              "deps_file"   : "DEPS",
              "managed"     : False,
              "custom_deps" : {},
            },
          ]
          target_os = ["linux"]
          EOF

      - name: Sync ANGLE source & dependencies
        run: |
          gclient sync --no-history --shallow

      - name: Configure build (ARM64 debug)
        run: |
          cd angle
          gn gen out/Release-arm64 --args='
            target_cpu = "arm64"
            is_debug = false
            is_component_build = false
            angle_enable_vulkan = true
            angle_enable_gl = true
            angle_enable_egl = true
            angle_build_all = true
          '

      - name: Build ANGLE
        run: |
          cd angle
          autoninja -C out/Release-arm64

      - name: Verify built artifacts
        run: |
          ls -lh angle/out/Release-arm64/libGLESv2.so angle/out/Release-arm64/libEGL.so || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle-arm64-linux
          path: |
            angle/out/Release-arm64/lib*.so
            angle/out/Release-arm64/*.a
            angle/out/Release-arm64/angle_*
